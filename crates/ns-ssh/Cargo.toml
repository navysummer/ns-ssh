[package]
name = "ns-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH client - pure Rust replacement for OpenSSH ssh"

[[bin]]
name = "ns-ssh"
path = "src/main.rs"

[dependencies]
ssh-core = { path = "../ssh-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
base64 = "0.22"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }
num-bigint = "0.4"
rsa = { version = "0.9", features = ["sha2", "sha1"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
ctr = "0.9"
bcrypt-pbkdf = "0.10"
atty = "0.2"
rpassword = "7"
libc = "0.2"
